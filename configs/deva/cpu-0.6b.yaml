project:
  name: DEVA-Core
  version: "0.1.0"
  compute: cpu

model:
  # Qwen3-0.6B is the initial pilot candidate. Verify its current model card/license
  # before downloading or redistributing weights.
  name: Qwen/Qwen3-0.6B
  max_length: 512

data:
  train: datasets/deva/train.jsonl
  validation: datasets/deva/validation.jsonl

training:
  epochs: 1
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.01
  gradient_checkpointing: true
  logging_steps: 1
  eval_steps: 10
  save_steps: 10

lora:
  rank: 4
  alpha: 8
  dropout: 0.05

output:
  adapter_dir: checkpoints/deva-core-0.6b-lora
  merged_dir: artifacts/deva-core-0.6b-merged
  metrics_dir: artifacts/metrics
